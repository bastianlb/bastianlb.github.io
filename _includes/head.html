<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E00L9PT3V9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-E00L9PT3V9');
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="{{ site.name }}">

  <!-- favicon: inline SVG emoji (no asset file) -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🪢</text></svg>'>

  {% if page.url == '/' %}
    <title>{{ site.name }}</title>
  {% elsif page.title %}
    <title>{{ page.title }} &middot; {{ site.name }}</title>
  {% else %}
    <title>{{ site.name }}</title>
  {% endif %}

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="stylesheet" type="text/css" href="{{ '/style.css' | relative_url }}">
  <link href="https://fonts.googleapis.com/css?family=Lato:400,400italic,700,700italic&display=swap" rel="stylesheet" type="text/css">
</head>
